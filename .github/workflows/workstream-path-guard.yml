name: Workstream path guard

# Ensures workstream / feature/<area>-* branches only change files for that area.
# Gate branches (debugging, project-manager, main) are skipped by the script.

on:
  pull_request:
    branches:
      - main
      - debugging
      - project-manager
      - frontend
      - backend
      - database
      - ai-rag
      - tooling-devops
      - testing
  push:
    branches:
      - frontend
      - backend
      - database
      - ai-rag
      - tooling-devops
      - testing
      - 'feature/**'

jobs:
  path-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve branch under check
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
            echo "base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "base=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check changed paths against workstream allowlist
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          chmod +x scripts/check-workstream-paths.sh
          if [ -n "${{ steps.meta.outputs.base }}" ]; then
            scripts/check-workstream-paths.sh "${{ steps.meta.outputs.branch }}" "${{ steps.meta.outputs.base }}"
          else
            scripts/check-workstream-paths.sh "${{ steps.meta.outputs.branch }}"
          fi
